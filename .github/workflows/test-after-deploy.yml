name: Test After Deploy

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages deployment
        run: sleep 60

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Landingpage Tests
        run: node tests/landingpage.spec.js https://digit500.github.io/poxdorf-app/

      - name: Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://digit500.github.io/poxdorf-app/
          temporaryPublicStorage: true
        continue-on-error: true
